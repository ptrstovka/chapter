x-chapter-environment: &chapter-environment
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY}
    APP_URL: ${APP_URL}
    APP_MAINTENANCE_DRIVER: cache
    APP_MAINTENANCE_STORE: redis
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: mariadb
    DB_HOST: mariadb
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-chapter}
    DB_USERNAME: ${DB_USERNAME:-chapter}
    DB_PASSWORD: ${DB_PASSWORD}
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: "true"
    QUEUE_CONNECTION: redis
    HORIZON_ENABLED: "true"
    QUEUE_WORKER_ENABLED: "false"
    VIDEO_JOB_TIMEOUT: "3540"
    FFMPEG_TIMEOUT: "3240"
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: "null"
    PRIVATE_STORAGE_PATH: /var/www/html/storage/app/private
    PUBLIC_STORAGE_PATH: /var/www/html/storage/app/public
    AUTORUN_ENABLED: "false"

services:
    app:
        image: ghcr.io/ptrstovka/chapter:latest
        restart: unless-stopped
        volumes:
            - chapter-data:/var/www/html/storage/app
        environment:
            <<: *chapter-environment
            AUTORUN_ENABLED: "true"
            AUTORUN_LARAVEL_MIGRATION: "true"
            AUTORUN_LARAVEL_MIGRATION_TIMEOUT: "120"
            HEALTHCHECK_PATH: /up
            SSL_MODE: "off"
        expose:
            - "8080"
        depends_on:
            mariadb:
                condition: service_healthy
                restart: true
            redis:
                condition: service_healthy
                restart: true
        healthcheck:
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 120s

    horizon:
        image: ghcr.io/ptrstovka/chapter:latest
        restart: unless-stopped
        volumes:
            - chapter-data:/var/www/html/storage/app
        environment: *chapter-environment
        depends_on:
            app:
                condition: service_healthy
                restart: true
        command: ["php", "artisan", "horizon"]
        stop_signal: SIGTERM
        stop_grace_period: 1h
        healthcheck:
            test: ["CMD", "healthcheck-horizon"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    scheduler:
        image: ghcr.io/ptrstovka/chapter:latest
        restart: unless-stopped
        volumes:
            - chapter-data:/var/www/html/storage/app
        environment: *chapter-environment
        depends_on:
            app:
                condition: service_healthy
                restart: true
        command: ["php", "artisan", "schedule:work"]
        stop_signal: SIGTERM
        stop_grace_period: 1m
        healthcheck:
            test: ["CMD", "healthcheck-schedule"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    mariadb:
        image: mariadb:12
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: ${DB_DATABASE:-chapter}
            MARIADB_USER: ${DB_USERNAME:-chapter}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mariadb-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    chapter-data:
    mariadb-data:
    redis-data:
